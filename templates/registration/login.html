{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | FCyT UNCA</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/fctunca.edu.py-512x512.png' %}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Hoja de Estilos Institucional -->
    <link rel="stylesheet" href="{% static 'css/institutional.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #091e3a 0%, #1a365d 50%, #0c2340 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 1.5rem;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #091e3a 0%, #133b68 100%);
            padding: 2.25rem 2rem 2rem;
            text-align: center;
            color: #ffffff;
        }
        .login-logo {
            width: 64px;
            height: 64px;
            background: #ffffff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            margin-bottom: 1rem;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        }
        .login-body {
            padding: 2.25rem 2rem;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .btn-institutional {
            background: #091e3a;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-institutional:hover {
            background: #133b68;
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <img src="{% static 'icons/fctunca.edu.py-512x512.png' %}" alt="FCyT UNCA" style="max-width: 100%; height: auto;">
            </div>
            <p class="small text-white-50 mb-0">Sistema de Control y Analítica de Egresados</p>
        </div>

        <div class="login-body">
            <div class="text-center mb-4">
                <h5 class="fw-semibold text-dark mb-1">Iniciar Sesión</h5>
                <p class="text-muted small">Ingrese sus credenciales institucionales</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger d-flex align-items-center py-2 px-3 small border-0 mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div>Usuario o contraseña incorrectos. Intente de nuevo.</div>
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="id_username" class="form-label small fw-semibold text-secondary">Usuario o Correo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control border-start-0" placeholder="Ej: admin">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control border-start-0" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-institutional w-100 shadow-sm d-flex align-items-center justify-content-center gap-2">
                    <span>Ingresar</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>
        </div>

        <div class="card-footer bg-light border-0 py-3 text-center small text-muted">
            Facultad de Ciencias y Tecnologías &bull; UNCA
        </div>
    </div>
</body>
</html>
